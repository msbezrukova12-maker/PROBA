name: Verify PROBA research datasets

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "sql/**"
      - ".github/workflows/verify-research.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "sql/**"
      - ".github/workflows/verify-research.yml"

jobs:
  verify-research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate research scripts and exercise offline product experiment
        run: |
          python -m py_compile scripts/analyze_ru_internships.py scripts/analyze_verified_entry_roles.py scripts/validate_interest_input.py scripts/analyze_wordstat_broad_2026_10.py scripts/analyze_wordstat_top_queries.py scripts/analyze_interest_pilot.py
          python scripts/analyze_ru_internships.py
          python scripts/analyze_verified_entry_roles.py
          python scripts/validate_interest_input.py
          python scripts/analyze_wordstat_broad_2026_10.py
          python scripts/analyze_wordstat_top_queries.py
      - name: Validate synthetic experiment fixture and session-level attribution
        run: |
          python -m unittest discover -s tests -p 'test_interest_pilot.py' -v
          python scripts/analyze_interest_pilot.py \
            --input tests/fixtures/SYNTHETIC_interest_events.csv \
            --experiment-id proba_career_interest_v1 \
            --start 2026-10-20 --end 2026-10-21 \
            --output /tmp/proba_interest_demo.json
          python - <<'PY'
          import json
          with open("/tmp/proba_interest_demo.json", encoding="utf-8") as f:
              report = json.load(f)
          assert report["status"] == "DEMONSTRATION_ONLY"
          assert report["data_origin"] == "SYNTHETIC"
          assert report["unit"] == "anonymous_sessions_not_unique_people"
          assert len(report["results"]) == 7
          assert all(r["sessions_exposed"] == 7 for r in report["results"])
          assert all(r["interpretation"] == "insufficient_exposures" for r in report["results"])
          assert all(r["sessions_intent"] <= r["sessions_exposed"] for r in report["results"])
          print("Synthetic pilot demo passed, no real demand inferred")
          PY
      - name: Verify generated CSV dimensions
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path("data")
          def read(name):
              with (p / name).open(encoding="utf-8", newline="") as f:
                  return list(csv.DictReader(f))
          assert len(read("hh_internships_moscow_2026-10-21.csv")) == 7
          assert len(read("hh_internship_first_two_audit_2026-10-21.csv")) == 14
          source = read("verified_entry_roles_2026-10-23.csv")
          assert len(source) == 16
          assert sum(row["relevance"] == "exact" for row in source) == 14
          assert sum(row["relevance"] == "adjacent" for row in source) == 2
          assert len(read("verified_role_coverage_2026-10-23.csv")) == 7
          assert len(read("verified_skill_frequency_2026-10-23.csv")) == 47
          audit = read("source_audit_2026-10-23.csv")
          assert len(audit) == 16
          assert {row["source_id"] for row in audit} == {row["source_id"] for row in source}
          assert sum(row["content_verified_2026_10_23"] == "page_readable" for row in audit) == 14
          assert sum(row["application_status_evidence"] == "explicit_archived" for row in audit) == 4
          assert sum(row["application_status_evidence"] == "deadline_expired" for row in audit) == 1
          new_interest = read("interest_wordstat_v2_template.csv")
          assert len(new_interest) == 21
          assert len({r["role"] for r in new_interest}) == 7
          historical = read("wordstat_how_to_partial_2026-10-26.csv")
          assert len(historical) == 48
          assert sum(bool(r["count_visible"]) for r in historical) == 44
          assert sum(not r["count_visible"] for r in historical) == 4
          interest = read("interest_wordstat_collection_template.csv")
          assert len(interest) == 14
          assert all(not row["observed_value"] for row in interest), "Never commit invented demand measurements"
          broad = read("wordstat_broad_monthly_2026-10-26.csv")
          assert len(broad) == 96
          assert sum(bool(r["search_count"]) for r in broad) == 88
          assert sum(not r["search_count"] for r in broad) == 8
          assert all(not r["search_count"] for r in broad if r["month"] == "2026-09")
          summary = read("wordstat_broad_11m_summary_2026-10-26.csv")
          assert len(summary) == 7
          assert [int(r["total_search_requests"]) for r in summary] == [
              340806,339946,301612,88064,86708,84401,81309
          ]
          top = read("wordstat_top_queries_2026-10-26.csv")
          assert len(top) == 180
          assert len({r["seed_query"] for r in top}) == 9
          assert len({r["role"] for r in top}) == 7
          assert all(r["range_start"] == "2026-09-08" and r["range_end"] == "2026-10-07" for r in top)
          intents = read("wordstat_intent_signals_2026-10-26.csv")
          assert len(intents) == 9
          assert {r["seed_query"] for r in intents} == {r["seed_query"] for r in top}
          print("Research integrity checks passed")
          PY
